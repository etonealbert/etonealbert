name: Koi

on:
  schedule:
    - cron: "20 0 * * *"
  workflow_dispatch:
  push:
    paths: [.github/workflows/koi.yml, scripts/make_pond.py, scripts/refresh_cards.py, 'koi-renderer/**']

permissions:
  contents: write

concurrency: koi

jobs:
  koi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: yalongwastaken/git-koi@v1.0.2
        with:
          body: asagi
          output-dir: koi
      - name: Render the koi's natural circular swim
        run: cargo run --release --locked --manifest-path koi-renderer/Cargo.toml -- "$RUNNER_TEMP/koi-snapshot.json" koi/cruise.gif
      - name: Place the koi in the pond
        run: |
          python -m pip install Pillow==11.3.0
          python scripts/make_pond.py
      - name: Refresh cached profile cards
        run: python scripts/refresh_cards.py
      - name: Commit the koi if it changed
        shell: bash
        run: |
          git add koi/koi.gif koi/pond.gif cards/
          if git diff --cached --quiet; then
            echo "The koi is unchanged; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --quiet --message "koi: draw the day's koi"
          git push --quiet
